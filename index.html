<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Výcuc dňa</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; }
  .slide { height: 100vh; height: 100dvh; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .bar { width: 100%; max-width: 480px; display: flex; gap: 8px; align-items: center; padding: 6px 10px; font-size: 13px; color: #bbb; }
  .bar b { color: #fff; }
  .bar a, .bar button { color: #9ab6ff; text-decoration: none; background: none; border: 0; font: inherit; padding: 4px 6px; cursor: pointer; }
  .bar .sp { margin-left: auto; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); background: #333; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 9; }
  .toast.on { opacity: 1; }
  .shareall { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 10px; background: rgba(0,0,0,.6); color: #9ab6ff; border: 0; padding: 4px 10px; border-radius: 999px; font: inherit; font-size: 12px; z-index: 5; }
  .frame { width: 100%; max-width: 480px; flex: 1; min-height: 0; background: #111; display: flex; align-items: center; justify-content: center; }
  .frame iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .msg { text-align: center; padding: 40px 20px; color: #aaa; }
  .count { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: 10px; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 999px; font-size: 12px; z-index: 5; }
</style>
</head>
<body>
<div class="count" id="count"></div>
<button class="shareall" id="shareAll" style="display:none">📤 Poslať celý výcuc</button>
<div class="toast" id="toast"></div>
<div id="feed"><p class="msg">Načítavam…</p></div>
<script>
// Formát odkazu: #t=<názov>&r=<kat>.<id>,<kat>.<id>,…  (kat: a=AI, l=learning, c=coffee, f=funny)
// Dáta sú len v časti za #, server ich nikdy nedostane.
const LABEL = { a: "🤖 AI", l: "📚 Learning", c: "☕ Coffee", f: "😂 Funny" };
const ok = id => /^[A-Za-z0-9_-]{5,20}$/.test(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const p = new URLSearchParams(location.hash.slice(1));
const title = p.get("t") || "Výcuc dňa";
const reels = (p.get("r") || "").split(",").map(x => { const [k, id] = x.includes(".") ? x.split(".") : ["", x]; return { k, id }; }).filter(x => ok(x.id));
document.title = title;
const feed = document.getElementById("feed");
if (!reels.length) {
  feed.innerHTML = '<p class="msg">Žiadne reels. Otvor prehrávač cez tlačidlo na stránke Reels výcuc.</p>';
} else {
  feed.innerHTML = reels.map((r, i) => `<section class="slide" data-i="${i}">
    <div class="bar"><b>${i + 1}/${reels.length}</b> ${esc(LABEL[r.k] || "")}
      <span class="sp"></span><button data-share="${r.id}">📤 Poslať</button>
      <a href="https://www.instagram.com/reel/${r.id}/" target="_blank" rel="noopener noreferrer">IG ↗</a></div>
    <div class="frame" data-id="${r.id}"><span class="msg">▶</span></div>
  </section>`).join("") + `<section class="slide"><p class="msg">✅ Hotovo, to je všetko na dnes.<br>Teraz môžeš Instagram nechať tak.</p></section>`;
  const toast = m => { const el = document.getElementById("toast"); el.textContent = m; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); };
  async function share(url, text) {
    try { if (navigator.share) { await navigator.share({ url, text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(url); toast("Odkaz skopírovaný"); } catch { prompt("Skopíruj odkaz:", url); }
  }
  document.querySelectorAll("[data-share]").forEach(b => b.onclick = () => share(`https://www.instagram.com/reel/${b.dataset.share}/`, ""));
  const sa = document.getElementById("shareAll"); sa.style.display = "";
  sa.onclick = () => share(location.href, title);
  const frames = [...document.querySelectorAll(".frame")];
  const load = f => { if (!f || f.dataset.on) return; f.dataset.on = 1;
    f.innerHTML = `<iframe src="https://www.instagram.com/reel/${f.dataset.id}/embed/" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen scrolling="no" loading="eager"></iframe>`; };
  const unload = f => { if (!f || !f.dataset.on) return; delete f.dataset.on; f.innerHTML = '<span class="msg">▶</span>'; };
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const i = +e.target.dataset.i;
    document.getElementById("count").textContent = `${i + 1}/${reels.length}`;
    // drž v pamäti len aktuálny ± 1, aby mobil nespadol
    frames.forEach((f, j) => Math.abs(j - i) <= 1 ? load(f) : unload(f));
  }), { root: feed, threshold: 0.6 });
  document.querySelectorAll(".slide[data-i]").forEach(s => io.observe(s));
}
</script>
</body>
</html>
